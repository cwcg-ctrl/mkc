<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>定點打卡系統</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f2f2f7;
    }
    .card {
      background: white;
      padding: 32px 24px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 320px;
      width: 85%;
    }
    .status-icon {
      font-size: 54px;
      margin-bottom: 16px;
    }
    h2 { margin: 0 0 12px; font-size: 20px; color: #1c1c1e; }
    p { margin: 6px 0; color: #8e8e93; font-size: 14px; }
    .highlight { color: #007aff; font-weight: 600; }
    .btn-close {
      margin-top: 24px;
      padding: 12px 24px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="card" id="status-card">
  <div class="status-icon" id="icon">⏳</div>
  <h2 id="title">正在驗證打卡...</h2>
  <p id="desc">請稍候，正在記錄打卡位置</p>
  <button class="btn-close" id="action-btn" style="display:none;" onclick="handleExit()">完成</button>
</div>

<script>
  // 部署前請替換為你的 Google Apps Script Web App URL。
  const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycb.../exec";

  // 1. 取得或生成裝置專屬 UUID
  function getDeviceUUID() {
    let uuid = localStorage.getItem('app_device_uuid');
    if (!uuid) {
      uuid = 'ios-' + ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      );
      localStorage.setItem('app_device_uuid', uuid);
    }
    return uuid;
  }

  // 2. 核心打卡流程
  async function performCheckIn() {
    const urlParams = new URLSearchParams(window.location.search);
    const locationId = urlParams.get('loc');

    // 若網址已無 loc 參數（例如已被重新整理或篡改），直接阻擋
    if (!locationId) {
      showResult('⚠️', '無法識別地點', '標籤資料遺失或已過期，請重新感應實體 NFC 標籤。', false);
      return;
    }

    const deviceId = getDeviceUUID();

    try {
      await fetch(GAS_ENDPOINT, {
        method: "POST",
        mode: "no-cors", // 配合 GAS 的跨域轉向處理
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          deviceId: deviceId,
          locationId: locationId,
          userAgent: navigator.userAgent
        })
      });

      // 關鍵防重刷手段：立即使用 replaceState 清除 URL 中的所有參數
      // 如此一來使用者即使按 Safari 重新整理，網址也不再帶有地點參數
      window.history.replaceState({}, document.title, window.location.pathname);

      // loc 來自網址，輸出前先跳脫，避免把分享連結中的內容當作 HTML 執行。
      const safeLocationId = escapeHTML(locationId);
      showResult('✅', '打卡成功！', `地點：<span class="highlight">${safeLocationId}</span><br>裝置 ID：${deviceId.substring(0, 12)}...`, true);

    } catch (error) {
      showResult('❌', '打卡失敗', '網路連線異常，請稍後重試。', false);
    }
  }

  function escapeHTML(value) {
    return value.replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[character]);
  }

  function showResult(icon, title, desc, success) {
    document.getElementById('icon').innerHTML = icon;
    document.getElementById('title').innerText = title;
    document.getElementById('desc').innerHTML = desc;
    document.getElementById('action-btn').style.display = 'block';

    // 如果成功，3 秒後可選擇導向空白頁或安全頁面，減少使用者滯留
    if (success) {
      setTimeout(() => {
        // 部分 iOS Safari 支援導向空白頁釋放分頁
        // window.location.href = "about:blank";
      }, 5000);
    }
  }

  function handleExit() {
    // 嘗試關閉，若 Safari 攔截則導向 about:blank
    window.opener = null;
    window.open('', '_self');
    window.close();
    setTimeout(() => {
      window.location.href = "about:blank";
    }, 300);
  }

  window.onload = performCheckIn;
</script>

</body>
</html>
