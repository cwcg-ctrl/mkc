<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>定點打卡系統</title>
  <style>
    :root {
      --primary: #007aff;
      --success: #34c759;
      --warning: #ff9500;
      --danger: #ff3b30;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --text-sub: #8e8e93;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 320px;
      width: 86%;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .status-icon {
      font-size: 54px;
      margin-bottom: 14px;
      line-height: 1;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
    }

    p.subtitle {
      margin: 0 0 18px;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.4;
    }

    /* 資訊展示區塊 */
    .info-box {
      background: #f8f9fa;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: var(--text-sub);
    }

    .info-value {
      font-weight: 600;
      color: var(--text);
    }

    /* UUID 專用展示方塊 */
    .uuid-container {
      background: #f2f2f7;
      border-radius: 10px;
      padding: 10px;
      margin: 14px 0 10px;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #3a3a3c;
      border: 1px dashed #c7c7cc;
      user-select: all;
    }

    /* 按鈕樣式 */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      box-sizing: border-box;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #e5e5ea; color: #1c1c1e; }

    /* 首次綁定表單 */
    .form-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #d1d1d6;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <div class="status-icon" id="icon">⏳</div>
  <h2 id="title">正在驗證打卡...</h2>
  <p class="subtitle" id="subtitle">請稍候，系統正透過 NFC 紀錄位置</p>

  <!-- 動態插入內容區 -->
  <div id="content-area"></div>
</div>

<script>
  // 請替換為你的 Google Apps Script Web App URL
  const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbx923BS7qMzgnT38TYfeLLtjSTGFs6Kdn1-pgYMU5TIsrC3i4vNqZr0H2nafgo_E8Gw9w/exec";

  // 1. 取得或生成永久 UUID
  function getDeviceUUID() {
    let uuid = localStorage.getItem('company_device_uuid');
    if (!uuid) {
      uuid = 'ios-' + crypto.randomUUID();
      localStorage.setItem('company_device_uuid', uuid);
    }
    return uuid;
  }

  // 取得當前格式化時間 (YYYY-MM-DD HH:mm:ss)
  function getFormattedCurrentTime() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const locationId = urlParams.get('loc');
  const deviceId = getDeviceUUID();

  // 2. 核心主流程
  async function init() {
    // 【需求 1】：若無法識別地點（缺少 loc 參數或已被重整），顯示當前 UUID
    if (!locationId) {
      showMissingLocationView();
      return;
    }

    try {
      const response = await fetch(GAS_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          action: 'checkin',
          deviceId: deviceId,
          locationId: locationId
        })
      });
      const res = await response.json();

      // 關鍵防重刷：立即清除網址列中的所有參數
      window.history.replaceState({}, document.title, window.location.pathname);

      if (res.status === 'success') {
        // 【需求 2】：打卡成功畫面，顯示當前時間
        showSuccessView(res.name || '員工', res.location || locationId, res.time || getFormattedCurrentTime());
      } else if (res.status === 'need_bind') {
        showBindFormView();
      } else if (res.status === 'cooldown') {
        showCooldownView(res.name, res.message);
      } else {
        showErrorView(res.message || '打卡未成功');
      }
    } catch (err) {
      showErrorView('網路連線失敗，請確認連線後重新感應');
    }
  }

  // --- 畫面渲染函式 ---

  // 畫面 1：無法識別地點時（展示 UUID）
  function showMissingLocationView() {
    document.getElementById('icon').innerText = '⚠️';
    document.getElementById('title').innerText = '無法識別地點';
    document.getElementById('subtitle').innerText = '網址未帶地點代碼（或已重新整理）。請重新拿手機碰觸實體 NFC 標籤。';

    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
      <div style="text-align: left; margin-top: 15px;">
        <span style="font-size: 13px; color: var(--text-sub); font-weight: 500;">本機裝置 ID (UUID)：</span>
        <div class="uuid-container" id="uuid-text">${deviceId}</div>
      </div>
      <button class="btn btn-secondary" onclick="copyUUID()">📋 複製裝置 UUID</button>
    `;
  }

  // 畫面 2：打卡成功（展示當前時間、地點、姓名）
  function showSuccessView(name, location, time) {
    document.getElementById('icon').innerText = '✅';
    document.getElementById('title').innerText = '打卡成功！';
    document.getElementById('subtitle').innerText = `你好，${name}，已記錄你的出勤狀態`;

    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
      <div class="info-box">
        <div class="info-row">
          <span class="info-label">打卡時間</span>
          <span class="info-value" style="color: var(--primary);">${time}</span>
        </div>
        <div class="info-row">
          <span class="info-label">打卡地點</span>
          <span class="info-value">${location}</span>
        </div>
        <div class="info-row">
          <span class="info-label">裝置代碼</span>
          <span class="info-value">${deviceId.substring(0, 12)}...</span>
        </div>
      </div>
      <p style="font-size: 12px; color: var(--text-sub); margin-top: 14px;">已防重刷鎖定，可直接切換或關閉分頁</p>
    `;
  }

  // 畫面 3：首次綁定表單
  function showBindFormView() {
    document.getElementById('icon').innerText = '📱';
    document.getElementById('title').innerText = '首次裝置綁定';
    document.getElementById('subtitle').innerText = '請輸入身分資訊完成此手機與工號的鎖定';

    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
      <div class="form-group">
        <label>員工工號</label>
        <input type="text" id="bind-emp" placeholder="例如：EMP001" autocomplete="off">
      </div>
      <div class="form-group">
        <label>預設 PIN 碼</label>
        <input type="password" id="bind-pin" placeholder="請輸入 4 位密碼" maxlength="8">
      </div>
      <div style="font-size: 11px; color: var(--text-sub); text-align: left; margin-bottom: 10px;">
        綁定裝置 ID：${deviceId.substring(0, 16)}...
      </div>
      <button class="btn btn-primary" onclick="submitBinding()">確認綁定並完成打卡</button>
    `;
  }

  // 畫面 4：重複打卡冷卻提示
  function showCooldownView(name, message) {
    document.getElementById('icon').innerText = 'ℹ️';
    document.getElementById('title').innerText = '打卡已完成';
    document.getElementById('subtitle').innerText = message;
    document.getElementById('content-area').innerHTML = `
      <div class="info-box">
        <div class="info-row">
          <span class="info-label">目前時間</span>
          <span class="info-value">${getFormattedCurrentTime()}</span>
        </div>
      </div>
    `;
  }

  // 畫面 5：錯誤提示
  function showErrorView(errMsg) {
    document.getElementById('icon').innerText = '❌';
    document.getElementById('title').innerText = '打卡失敗';
    document.getElementById('subtitle').innerText = errMsg;
    document.getElementById('content-area').innerHTML = `
      <button class="btn btn-secondary" onclick="location.reload()">重新整理</button>
    `;
  }

  // 輔助功能：複製 UUID 到剪貼簿
  function copyUUID() {
    navigator.clipboard.writeText(deviceId).then(() => {
      alert("✅ 裝置 UUID 已成功複製到剪貼簿！");
    }).catch(() => {
      // 若 Safari 阻擋 clipboard API 的備用方案
      const range = document.createRange();
      range.selectNode(document.getElementById('uuid-text'));
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      alert("✅ 裝置 UUID 已複製！");
    });
  }

  // 提交首次綁定
  async function submitBinding() {
    const empId = document.getElementById('bind-emp').value.trim();
    const pin = document.getElementById('bind-pin').value.trim();

    if (!empId || !pin) {
      alert("請填寫工號及 PIN 碼");
      return;
    }

    document.getElementById('content-area').innerHTML = '<p style="color:var(--text-sub);">正在綁定並打卡中...</p>';

    try {
      const response = await fetch(GAS_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          action: 'bind',
          deviceId: deviceId,
          locationId: locationId,
          empId: empId,
          pin: pin
        })
      });
      const res = await response.json();
      window.history.replaceState({}, document.title, window.location.pathname);

      if (res.status === 'success') {
        showSuccessView(res.name, res.location || locationId, res.time || getFormattedCurrentTime());
      } else {
        alert(res.message);
        showBindFormView();
      }
    } catch (e) {
      showErrorView('連線異常，請稍後再試');
    }
  }

  window.onload = init;
</script>

</body>
</html>
