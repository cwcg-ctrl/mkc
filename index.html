<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>定點打卡系統</title>
  <style>
    :root {
      --primary: #007aff;
      --success: #34c759;
      --warning: #ff9500;
      --danger: #ff3b30;
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --text-sub: #8e8e93;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--card-bg);
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 320px;
      width: 86%;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .status-icon {
      font-size: 54px;
      margin-bottom: 14px;
      line-height: 1;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 21px;
      font-weight: 700;
      color: var(--text);
    }

    p.subtitle {
      margin: 0 0 18px;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.4;
    }

    /* 資訊展示區塊 */
    .info-box {
      background: #f8f9fa;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      color: var(--text-sub);
    }

    .info-value {
      font-weight: 600;
      color: var(--text);
    }

    /* 倒數計時提示標籤 */
    .countdown-badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .badge-success {
      background: #eef7ee;
      color: #248a3d;
    }

    .badge-warning {
      background: #fff4e5;
      color: #b25e00;
    }

    /* UUID 專用展示方塊 */
    .uuid-container {
      background: #f2f2f7;
      border-radius: 10px;
      padding: 10px;
      margin: 14px 0 10px;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #3a3a3c;
      border: 1px dashed #c7c7cc;
      user-select: all;
    }

    /* 按鈕樣式 */
    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      box-sizing: border-box;
    }

    .btn-secondary {
      background: #e5e5ea;
      color: #1c1c1e;
    }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <div class="status-icon" id="icon">⏳</div>
  <h2 id="title">正在驗證打卡...</h2>
  <p class="subtitle" id="subtitle">請稍候，系統正透過 NFC 紀錄位置</p>

  <!-- 動態內容區 -->
  <div id="content-area"></div>
</div>

<script>
  // Google Apps Script Web App URL
  const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbx923BS7qMzgnT38TYfeLLtjSTGFs6Kdn1-pgYMU5TIsrC3i4vNqZr0H2nafgo_E8Gw9w/exec";

  // 1. 取得或生成裝置專屬 UUID
  function getDeviceUUID() {
    let uuid = localStorage.getItem('company_device_uuid');
    if (!uuid) {
      uuid = 'ios-' + crypto.randomUUID();
      localStorage.setItem('company_device_uuid', uuid);
    }
    return uuid;
  }

  // 取得當前格式化時間 (YYYY-MM-DD HH:mm:ss)
  function getFormattedCurrentTime() {
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const locationId = urlParams.get('loc');
  const deviceId = getDeviceUUID();

  // 2. 核心主流程（直接感應打卡，無身分綁定步驟）
  async function init() {
    // 若無法識別地點（未帶 loc 參數或已重整）：顯示當前 UUID 並啟動 3 秒自動關閉
    if (!locationId) {
      showMissingLocationView();
      return;
    }

    try {
      const response = await fetch(GAS_ENDPOINT, {
        method: "POST",
        body: JSON.stringify({
          deviceId: deviceId,
          locationId: locationId,
          userAgent: navigator.userAgent
        })
      });
      const res = await response.json();

      // 關鍵防重刷：立即清除網址列中的所有參數
      window.history.replaceState({}, document.title, window.location.pathname);

      if (res.status === 'success') {
        showSuccessView(res.location || locationId, res.time || getFormattedCurrentTime());
      } else if (res.status === 'cooldown') {
        showCooldownView(res.message);
      } else {
        showErrorView(res.message || '打卡未成功');
      }
    } catch (err) {
      showErrorView('網路連線失敗，請確認連線後重新感應');
    }
  }

  // --- 畫面渲染函式 ---

  // 畫面 1：無法識別地點時（展示 UUID，並啟動 3 秒自動關閉）
  function showMissingLocationView() {
    document.getElementById('icon').innerText = '⚠️';
    document.getElementById('title').innerText = '無法識別地點';
    document.getElementById('subtitle').innerText = '未帶地點代碼（或已重新整理）。請重新拿手機碰觸實體 NFC 標籤。';

    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
      <div style="text-align: left; margin-top: 15px;">
        <span style="font-size: 13px; color: var(--text-sub); font-weight: 500;">本機裝置 ID (UUID)：</span>
        <div class="uuid-container" id="uuid-text">${deviceId}</div>
      </div>
      <button class="btn btn-secondary" onclick="copyUUID()">📋 複製裝置 UUID</button>
      <div class="countdown-badge badge-warning" id="missing-timer">⏳ 視窗將在 3 秒後自動關閉</div>
    `;

    // 啟動 3 秒自動關閉倒數
    startAutoCloseCountdown(3, 'missing-timer');
  }

  // 畫面 2：打卡成功（展示當前時間、地點、裝置 ID，並啟動 3 秒自動關閉）
  function showSuccessView(location, time) {
    document.getElementById('icon').innerText = '✅';
    document.getElementById('title').innerText = '打卡成功！';
    document.getElementById('subtitle').innerText = '已記錄你的出勤狀態';

    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
      <div class="info-box">
        <div class="info-row">
          <span class="info-label">打卡時間</span>
          <span class="info-value" style="color: var(--primary);">${time}</span>
        </div>
        <div class="info-row">
          <span class="info-label">打卡地點</span>
          <span class="info-value">${location}</span>
        </div>
        <div class="info-row">
          <span class="info-label">裝置代碼</span>
          <span class="info-value">${deviceId.substring(0, 12)}...</span>
        </div>
      </div>
      <div class="countdown-badge badge-success" id="success-timer">⏳ 視窗將在 3 秒後自動關閉</div>
      <button class="btn btn-secondary" onclick="closeWindowNow()" style="margin-top: 16px;">立即關閉分頁</button>
    `;

    // 啟動 3 秒自動關閉倒數
    startAutoCloseCountdown(3, 'success-timer');
  }

  // 通用 3 秒倒數計時函式
  function startAutoCloseCountdown(seconds, elementId) {
    let remaining = seconds;
    const timerElem = document.getElementById(elementId);

    const interval = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        if (timerElem) timerElem.innerText = `⏳ 視窗將在 ${remaining} 秒後自動關閉`;
      } else {
        clearInterval(interval);
        if (timerElem) timerElem.innerText = '✅ 視窗關閉中...';
        closeWindowNow();
      }
    }, 1000);
  }

  // 執行關閉分頁（相容 iOS Safari 限制機制）
  function closeWindowNow() {
    window.opener = null;
    window.open('', '_self');
    window.close();

    // iOS Safari 安全沙盒阻擋 window.close() 時，導向 about:blank 空白頁
    setTimeout(() => {
      window.location.href = "about:blank";
    }, 300);
  }

  // 畫面 3：重複打卡冷卻提示
  function showCooldownView(message) {
    document.getElementById('icon').innerText = 'ℹ️';
    document.getElementById('title').innerText = '打卡提醒';
    document.getElementById('subtitle').innerText = message;
    document.getElementById('content-area').innerHTML = `
      <div class="info-box">
        <div class="info-row">
          <span class="info-label">目前時間</span>
          <span class="info-value">${getFormattedCurrentTime()}</span>
        </div>
      </div>
      <button class="btn btn-secondary" onclick="closeWindowNow()" style="margin-top: 16px;">關閉分頁</button>
    `;
    startAutoCloseCountdown(3, 'cooldown-timer');
  }

  // 畫面 4：錯誤提示
  function showErrorView(errMsg) {
    document.getElementById('icon').innerText = '❌';
    document.getElementById('title').innerText = '打卡失敗';
    document.getElementById('subtitle').innerText = errMsg;
    document.getElementById('content-area').innerHTML = `
      <button class="btn btn-secondary" onclick="location.reload()">重新整理</button>
    `;
  }

  // 複製 UUID 到剪貼簿
  function copyUUID() {
    navigator.clipboard.writeText(deviceId).then(() => {
      alert("✅ 裝置 UUID 已成功複製到剪貼簿！");
    }).catch(() => {
      const range = document.createRange();
      range.selectNode(document.getElementById('uuid-text'));
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      alert("✅ 裝置 UUID 已複製！");
    });
  }

  window.onload = init;
</script>

</body>
</html>
